<style>
/* ==========================================================================
   SolShield — design tokens
   ========================================================================== */

:root {
  /* Backgrounds */
  --bg-0: #07090a;        /* page */
  --bg-1: #0b0e10;        /* card */
  --bg-2: #10151a;        /* card hover */
  --bg-3: #161c22;        /* inset */

  /* Borders */
  --br-1: #1a2127;
  --br-2: #242d35;
  --br-3: #38434d;

  /* Text */
  --fg-0: #e8efe7;        /* primary */
  --fg-1: #aab5ad;        /* secondary */
  --fg-2: #6b7670;        /* tertiary */
  --fg-3: #3d4540;        /* quaternary / dim */

  /* Semantic accents */
  --ok:   #00ff66;        /* safe / go */
  --ok-2: #00b84a;
  --warn: #ffab00;        /* caution */
  --warn-2: #cc8800;
  --bad:  #ff3b53;        /* danger / block */
  --bad-2: #cc1f35;

  /* Typography */
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* Layout */
  --maxw: 1240px;
  --pad: clamp(20px, 3vw, 40px);
  --radius: 4px;
  --radius-lg: 8px;
}

/* Accent themes (applied via data-accent on <html>) */
html[data-accent="triad"] {
  --ok: #00ff66; --warn: #ffab00; --bad: #ff3b53;
}
html[data-accent="duo"] {
  --ok: #ffab00; --warn: #ffab00; --bad: #ff3b53;
}
html[data-accent="cyan"] {
  --ok: #00ff66; --warn: #ffab00; --bad: #00e5ff;
}
html[data-accent="amber"] {
  --ok: #ffab00; --warn: #ffab00; --bad: #ffab00;
}

/* ==========================================================================
   Reset + base
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

html {
  background: var(--bg-0);
  color: var(--fg-0);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.55;
  font-feature-settings: "ss01", "ss02", "cv01", "cv02";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(0,255,102,0.06), transparent 60%),
    radial-gradient(900px 500px at 100% 20%, rgba(255,171,0,0.03), transparent 60%),
    var(--bg-0);
}

html[data-density="airy"]  { font-size: 16px; }
html[data-density="dense"] { font-size: 14px; }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }

/* Selection */
::selection { background: var(--ok); color: var(--bg-0); }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-0); }
::-webkit-scrollbar-thumb { background: var(--br-2); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--br-3); }

/* ==========================================================================
   Utility
   ========================================================================== */

.container {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 var(--pad);
}

.mono { font-family: var(--mono); }
.dim { color: var(--fg-2); }
.fg-1 { color: var(--fg-1); }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.bad { color: var(--bad); }

.small { font-size: 12px; letter-spacing: 0.02em; }
.tiny { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }

.hr { height: 1px; background: var(--br-1); border: 0; margin: 0; }
.vr { width: 1px; background: var(--br-1); align-self: stretch; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--br-2);
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg-1);
  background: rgba(255,255,255,0.01);
}
.pill .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 8px var(--ok);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 18px;
  border: 1px solid var(--br-2);
  border-radius: var(--radius);
  background: var(--bg-1);
  color: var(--fg-0);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: all 0.12s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-2); border-color: var(--br-3); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-primary {
  background: var(--ok);
  color: #000;
  border-color: var(--ok);
  font-weight: 600;
}
.btn-primary:hover {
  background: var(--ok);
  border-color: var(--ok);
  box-shadow: 0 0 0 3px rgba(0,255,102,0.15);
}

.btn-ghost {
  background: transparent;
  border-color: var(--br-2);
}

.btn .kbd {
  display: inline-block;
  padding: 1px 5px;
  font-size: 10px;
  color: var(--fg-1);
  background: var(--bg-0);
  border: 1px solid var(--br-2);
  border-radius: 3px;
  margin-left: 4px;
}

.card {
  background: var(--bg-1);
  border: 1px solid var(--br-1);
  border-radius: var(--radius-lg);
  padding: 24px;
}

.label {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-2);
  font-weight: 500;
}

.anchor {
  color: var(--ok);
  text-decoration: none;
  border-bottom: 1px dashed transparent;
  transition: border-color 0.12s;
}
.anchor:hover { border-bottom-color: var(--ok); }

/* Caret for typing terminals */
.caret {
  display: inline-block;
  width: 0.55ch;
  height: 1.1em;
  vertical-align: text-bottom;
  background: var(--ok);
  animation: blink 1s steps(2) infinite;
  margin-left: 2px;
}
@keyframes blink { 50% { opacity: 0; } }

/* ==========================================================================
   Matrix background
   ========================================================================== */

.matrix-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.25;
}

/* ==========================================================================
   Nav
   ========================================================================== */

.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(12px);
  background: rgba(7,9,10,0.75);
  border-bottom: 1px solid var(--br-1);
}
.nav-inner {
  display: flex;
  align-items: center;
  gap: 32px;
  height: 56px;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.01em;
}
.brand-mark {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  color: var(--bg-0);
  background: var(--ok);
  border-radius: 3px;
  font-weight: 700;
  font-size: 13px;
}
.brand-version {
  color: var(--fg-2);
  font-weight: 400;
  font-size: 11px;
  margin-left: 2px;
}
.nav-links {
  display: flex; align-items: center; gap: 4px;
  font-size: 13px;
}
.nav-links a {
  color: var(--fg-1);
  padding: 6px 10px;
  border-radius: 4px;
  transition: color 0.12s, background 0.12s;
}
.nav-links a:hover { color: var(--fg-0); background: var(--bg-1); }
.nav-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px;
}
.gh-stars {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  border: 1px solid var(--br-2);
  border-radius: 4px;
  font-size: 12px;
  color: var(--fg-1);
  transition: all 0.12s;
}
.gh-stars:hover { background: var(--bg-1); color: var(--fg-0); }
.gh-stars .star { color: var(--warn); }

/* ==========================================================================
   Hero
   ========================================================================== */

.hero {
  position: relative;
  padding: clamp(48px, 9vw, 108px) 0 clamp(40px, 7vw, 80px);
}
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: clamp(32px, 5vw, 72px);
  align-items: center;
}
@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; }
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  margin-bottom: 28px;
}
.hero-title {
  font-size: clamp(32px, 4.8vw, 58px);
  line-height: 1.02;
  letter-spacing: -0.03em;
  font-weight: 700;
  margin: 0 0 22px;
  text-wrap: balance;
}
.hero-title .hi { color: var(--ok); }
.hero-title .strike {
  color: var(--fg-2);
  position: relative;
  white-space: nowrap;
}
.hero-title .strike::after {
  content: "";
  position: absolute;
  left: -2%; right: -2%;
  top: 50%;
  height: 3px;
  background: var(--bad);
  transform: translateY(-50%) rotate(-1.5deg);
}
.hero-sub {
  font-size: clamp(15px, 1.4vw, 17px);
  color: var(--fg-1);
  max-width: 48ch;
  margin: 0 0 32px;
  line-height: 1.6;
  text-wrap: pretty;
}
.hero-cta {
  display: flex; flex-wrap: wrap; gap: 12px;
  margin-bottom: 28px;
}
.hero-meta {
  display: flex; flex-wrap: wrap; gap: 20px 32px;
  color: var(--fg-2);
  font-size: 12px;
}
.hero-meta > span { display: inline-flex; align-items: center; gap: 6px; }
.hero-meta .dot-ok { color: var(--ok); }
.hero-meta .dot-warn { color: var(--warn); }

/* ==========================================================================
   Terminal panel (hero right)
   ========================================================================== */

.term {
  background: #04060700;
  border: 1px solid var(--br-2);
  border-radius: 8px;
  overflow: hidden;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.02) inset,
    0 40px 80px -40px rgba(0,255,102,0.15),
    0 20px 40px -20px rgba(0,0,0,0.8);
  background:
    linear-gradient(180deg, #0a0e0f 0%, #060809 100%);
}
.term-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--br-1);
  background: #0b0f10;
}
.term-dots { display: flex; gap: 6px; }
.term-dots i {
  display: block; width: 11px; height: 11px; border-radius: 50%;
  background: var(--bg-3);
}
.term-dots i:nth-child(1) { background: #ff5f57; }
.term-dots i:nth-child(2) { background: #febc2e; }
.term-dots i:nth-child(3) { background: #28c840; }
.term-title {
  font-size: 11px;
  color: var(--fg-2);
  letter-spacing: 0.04em;
  margin-left: 8px;
  flex: 1;
  text-align: center;
}
.term-badge {
  font-size: 10px;
  color: var(--ok);
  border: 1px solid var(--ok);
  border-radius: 3px;
  padding: 1px 6px;
  letter-spacing: 0.08em;
}
.term-body {
  padding: 18px 20px 22px;
  min-height: 360px;
  font-size: 13px;
  line-height: 1.65;
  font-family: var(--mono);
  color: var(--fg-0);
  overflow: hidden;
}
.term-line { display: flex; gap: 10px; white-space: pre-wrap; }
.term-line .prompt { color: var(--ok); user-select: none; }
.term-line .out { color: var(--fg-1); }
.term-kv { color: var(--fg-2); }
.term-kv b { color: var(--fg-0); font-weight: 500; }
.term-row-ok   { color: var(--ok); }
.term-row-warn { color: var(--warn); }
.term-row-bad  { color: var(--bad); }
.term-box {
  margin: 8px 0;
  padding: 10px 12px;
  border-left: 2px solid var(--bad);
  background: rgba(255,59,83,0.06);
}
.term-box.ok { border-left-color: var(--ok); background: rgba(0,255,102,0.05); }
.term-box.warn { border-left-color: var(--warn); background: rgba(255,171,0,0.06); }

/* ==========================================================================
   Section heading
   ========================================================================== */

.section {
  padding: clamp(56px, 8vw, 96px) 0;
  position: relative;
}
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 44px;
  flex-wrap: wrap;
}
.section-head h2 {
  margin: 0;
  font-size: clamp(24px, 3vw, 36px);
  letter-spacing: -0.02em;
  font-weight: 600;
  max-width: 28ch;
  text-wrap: balance;
}
.section-head .kicker {
  font-size: 11px;
  color: var(--fg-2);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px;
}
.section-head .kicker::before {
  content: "";
  width: 18px; height: 1px; background: var(--ok);
}
.section-head p {
  max-width: 42ch;
  color: var(--fg-1);
  margin: 0;
}

/* ==========================================================================
   Stats strip
   ========================================================================== */

.stats {
  border-top: 1px solid var(--br-1);
  border-bottom: 1px solid var(--br-1);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
}
@media (max-width: 800px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
.stat {
  padding: 28px 24px;
  border-right: 1px solid var(--br-1);
}
.stat:last-child { border-right: 0; }
@media (max-width: 800px) {
  .stat:nth-child(2n) { border-right: 0; }
  .stat:nth-child(-n+2) { border-bottom: 1px solid var(--br-1); }
}
.stat .v {
  font-size: clamp(28px, 3.6vw, 42px);
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--fg-0);
  font-variant-numeric: tabular-nums;
}
.stat .v .u { color: var(--fg-2); font-weight: 400; margin-left: 4px; font-size: 0.6em; }
.stat .l {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-2);
  margin-top: 6px;
}
.stat .d { font-size: 12px; color: var(--fg-1); margin-top: 8px; }
.stat .d .up { color: var(--ok); }
.stat .d .down { color: var(--bad); }

/* ==========================================================================
   Overlay demo
   ========================================================================== */

.demo-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media (max-width: 900px) { .demo-wrap { grid-template-columns: 1fr; } }
.demo-col {
  background: var(--bg-1);
  border: 1px solid var(--br-1);
  border-radius: 10px;
  padding: 18px;
  min-height: 420px;
  display: flex; flex-direction: column;
}
.demo-col header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.demo-col .label { color: var(--fg-1); font-size: 12px; }

.browser {
  background: #0f1518;
  border: 1px solid var(--br-2);
  border-radius: 6px;
  overflow: hidden;
  flex: 1;
  display: flex; flex-direction: column;
  position: relative;
}
.browser-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--br-1);
  background: #0b1012;
}
.browser-bar .dots { display: flex; gap: 5px; }
.browser-bar .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--bg-3); }
.browser-bar .dots i:nth-child(1) { background: #ff5f57; }
.browser-bar .dots i:nth-child(2) { background: #febc2e; }
.browser-bar .dots i:nth-child(3) { background: #28c840; }
.browser-bar .url {
  flex: 1;
  font-size: 11px;
  color: var(--fg-2);
  background: var(--bg-0);
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid var(--br-1);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.browser-bar .url .https { color: var(--ok); }
.browser-bar .url .bad { color: var(--bad); }
.browser-body {
  flex: 1;
  position: relative;
  padding: 22px;
  background:
    linear-gradient(180deg, #0f1518, #0a0f12);
}

.fake-dapp {
  color: var(--fg-1);
  font-size: 12px;
}
.fake-dapp h3 {
  color: var(--fg-0);
  font-size: 18px;
  margin: 0 0 4px;
  letter-spacing: -0.01em;
  font-weight: 600;
}
.fake-dapp .host {
  font-size: 11px;
  color: var(--fg-2);
  margin-bottom: 18px;
}
.fake-dapp .tile {
  background: var(--bg-3);
  border: 1px solid var(--br-1);
  padding: 10px 12px;
  border-radius: 4px;
  display: flex; justify-content: space-between;
  margin-bottom: 8px;
  font-size: 11px;
}

/* Overlay modal */
.overlay-modal {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(92%, 340px);
  background: #0a0d0e;
  border: 1px solid var(--br-3);
  border-radius: 8px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8),
              0 0 0 1px rgba(0,0,0,0.5),
              0 0 40px -10px rgba(255,59,83,0.3);
  overflow: hidden;
  z-index: 2;
}
.overlay-modal.ok {
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8),
              0 0 0 1px rgba(0,0,0,0.5),
              0 0 40px -10px rgba(0,255,102,0.3);
}
.overlay-head {
  padding: 12px 14px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--br-1);
  background: rgba(255,59,83,0.08);
}
.overlay-modal.ok .overlay-head { background: rgba(0,255,102,0.06); }
.overlay-modal.warn .overlay-head { background: rgba(255,171,0,0.08); }
.overlay-head .badge {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--bad);
  color: var(--bad);
  font-weight: 600;
}
.overlay-modal.ok .overlay-head .badge { border-color: var(--ok); color: var(--ok); }
.overlay-modal.warn .overlay-head .badge { border-color: var(--warn); color: var(--warn); }
.overlay-head .t { font-size: 13px; font-weight: 600; }
.overlay-body { padding: 14px; font-size: 12px; line-height: 1.5; }
.overlay-body .row {
  display: flex; justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px dashed var(--br-1);
  color: var(--fg-1);
}
.overlay-body .row:last-of-type { border-bottom: 0; }
.overlay-body .row b { color: var(--fg-0); font-weight: 500; text-align: right; word-break: break-all; margin-left: 12px; }
.overlay-body .reasons {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--br-1);
}
.overlay-body .reasons li {
  display: flex; gap: 8px; padding: 3px 0;
  font-size: 11px;
  color: var(--fg-1);
}
.overlay-body .reasons li::before {
  content: "×"; color: var(--bad); font-weight: 700; flex-shrink: 0;
}
.overlay-modal.ok .overlay-body .reasons li::before { content: "✓"; color: var(--ok); }
.overlay-modal.warn .overlay-body .reasons li::before { content: "!"; color: var(--warn); }
.overlay-actions {
  display: flex; gap: 6px;
  padding: 12px 14px;
  background: var(--bg-0);
  border-top: 1px solid var(--br-1);
}
.overlay-actions button {
  flex: 1;
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 3px;
  border: 1px solid var(--br-2);
  background: transparent;
  color: var(--fg-1);
  cursor: pointer;
  transition: all 0.12s;
}
.overlay-actions button:hover { background: var(--bg-2); color: var(--fg-0); }
.overlay-actions .block {
  background: var(--bad);
  border-color: var(--bad);
  color: #fff;
  font-weight: 600;
}
.overlay-modal.ok .overlay-actions .block {
  background: var(--ok); border-color: var(--ok); color: #000;
}

/* Dim host page when overlay is active */
.browser-body.dim::after {
  content: "";
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(2px);
  z-index: 1;
}

/* Demo controls */
.demo-controls {
  display: flex; gap: 6px;
  margin-bottom: 14px;
  padding: 4px;
  background: var(--bg-0);
  border: 1px solid var(--br-1);
  border-radius: 5px;
  width: fit-content;
}
.demo-controls button {
  padding: 6px 12px;

/* ==== MatrixBg.jsx ==== */
/* Matrix-style falling glyph background — subtle, performant */
const MatrixBg = ({ enabled = true }) => {
  const canvasRef = React.useRef(null);

  React.useEffect(() => {
    if (!enabled) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf, cols, drops, w, h;
    const chars = '0123456789ABCDEF$SOLABCDEFabcdef{}[]()<>:;.+-*/\\|';
    const fontSize = 13;

    const resize = () => {
      w = canvas.width = window.innerWidth * devicePixelRatio;
      h = canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      cols = Math.floor(w / (fontSize * devicePixelRatio));
      drops = new Array(cols).fill(0).map(() => Math.random() * -100);
    };
    resize();
    window.addEventListener('resize', resize);

    const draw = () => {
      ctx.fillStyle = 'rgba(7,9,10,0.08)';
      ctx.fillRect(0, 0, w, h);
      ctx.font = `${fontSize * devicePixelRatio}px "JetBrains Mono", monospace`;
      for (let i = 0; i < cols; i++) {
        const ch = chars[Math.floor(Math.random() * chars.length)];
        const x = i * fontSize * devicePixelRatio;
        const y = drops[i] * fontSize * devicePixelRatio;

        // leading char bright, trail dim
        if (Math.random() > 0.98) {
          ctx.fillStyle = 'rgba(0,255,102,0.9)';
        } else {
          ctx.fillStyle = 'rgba(0,180,70,0.35)';
        }
        ctx.fillText(ch, x, y);

        if (y > h && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      raf = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, [enabled]);

  if (!enabled) return null;
  return <canvas ref={canvasRef} className="matrix-bg" />;
};

window.MatrixBg = MatrixBg;

/* ==== Hero.jsx ==== */
/* Hero with live typing terminal that simulates scanning a malicious tx */

const HERO_SCRIPT = [
  { t: 'prompt', v: '$ solshield scan --tx 5Kd7Yq...rN4mP2' },
  { t: 'out',    v: 'connecting to mainnet-beta... ok' },
  { t: 'out',    v: 'parsing instructions (4) ... ok' },
  { t: 'out',    v: 'resolving program ids ............ ok' },
  { t: 'spacer' },
  { t: 'kv',     k: 'program  ', v: 'unknown · Drainer77xQ...8aK' },
  { t: 'kv',     k: 'signer   ', v: '7xQdh...m2NpL (your wallet)' },
  { t: 'kv',     k: 'ask      ', v: 'setAuthority + transfer (ALL)' },
  { t: 'spacer' },
  { t: 'out',    v: '▶ running heuristics [████████████] 14/14' },
  { t: 'spacer' },
  { t: 'box-bad', lines: [
    { t: 'bad', v: '  ✗  VERDICT: BLOCK  (confidence 0.97)' },
    { t: 'warn', v: '  ✗  signs ALL token accounts to unknown program' },
    { t: 'warn', v: '  ✗  program flagged by 3 community reporters' },
    { t: 'warn', v: '  ✗  simulation shows net change −$4,218.44' },
  ]},
  { t: 'spacer' },
  { t: 'out',    v: 'transaction blocked before signing. ✓' },
  { t: 'prompt', v: '$ _', noType: true },
];

const Hero = ({ accent = 'triad' }) => {
  const [lineIdx, setLineIdx] = React.useState(0);
  const [charIdx, setCharIdx] = React.useState(0);
  const [done, setDone]       = React.useState(false);
  const [liveTx, setLiveTx]   = React.useState(1420847);

  // Typing animation
  React.useEffect(() => {
    if (done) return;
    const line = HERO_SCRIPT[lineIdx];
    if (!line) { setDone(true); return; }

    // Composite lines (box) render instantly after a pause
    if (line.t === 'spacer' || line.t === 'box-bad' || line.noType) {
      const pause = line.t === 'box-bad' ? 280 : 120;
      const id = setTimeout(() => { setLineIdx(lineIdx + 1); setCharIdx(0); }, pause);
      return () => clearTimeout(id);
    }

    const text = line.v ?? ((line.k || '') + (line.v || ''));
    const full = line.t === 'kv' ? (line.k + line.v) : text;

    if (charIdx < full.length) {
      const speed = line.t === 'prompt' ? 18 : (line.t === 'out' ? 8 : 6);
      const id = setTimeout(() => setCharIdx(charIdx + 1), speed + Math.random() * 10);
      return () => clearTimeout(id);
    } else {
      const id = setTimeout(() => { setLineIdx(lineIdx + 1); setCharIdx(0); }, 60);
      return () => clearTimeout(id);
    }
  }, [lineIdx, charIdx, done]);

  // Live tx ticker
  React.useEffect(() => {
    const id = setInterval(() => setLiveTx(n => n + Math.floor(1 + Math.random() * 4)), 900);
    return () => clearInterval(id);
  }, []);

  const restart = () => { setLineIdx(0); setCharIdx(0); setDone(false); };

  // Build visible lines
  const visible = [];
  for (let i = 0; i < lineIdx; i++) visible.push({ line: HERO_SCRIPT[i], full: true });
  if (!done && HERO_SCRIPT[lineIdx]) visible.push({ line: HERO_SCRIPT[lineIdx], full: false });

  return (
    <section className="hero">
      <div className="container hero-grid">
        <div>
          <div className="hero-eyebrow">
            <span className="pill"><span className="dot" /> live on mainnet-beta</span>
            <span className="tiny" style={{color: 'var(--fg-2)'}}>v0.4.10 · public beta · apr 2026</span>
          </div>

          <h1 className="hero-title">
            The <span className="strike">last mistake</span> <span className="hi">verdict</span> your<br/>
            Solana wallet will ever need.
          </h1>

          <p className="hero-sub">
            SolShield sits between your wallet and the signing prompt. It runs 23 deterministic
            rules + Anthropic <b>Claude Opus 4.7</b> + <b>Haiku 4.5</b>, then shows you a
            plain-English verdict <em>before</em> anything leaves your keys. Open source,
            self-hostable, every rule and prompt in-tree.
          </p>

          <div className="hero-cta">
            <a href="#install" className="btn btn-primary">
              <span>▸</span> install extension
            </a>
            <a href="#demo" className="btn btn-ghost">see it block a drainer →</a>
          </div>

          <div className="hero-meta">
            <span><span className="dot-ok">●</span> 23 deterministic rules</span>
            <span><span className="dot-ok">●</span> claude opus 4.7 + haiku 4.5</span>
            <span><span className="dot-warn">●</span> auditable prompts in-tree</span>
            <span className="dim">mit licensed</span>
          </div>
        </div>

        <div>
          <div className="term">
            <div className="term-head">
              <div className="term-dots"><i/><i/><i/></div>
              <div className="term-title">~/solshield — scanning tx 5Kd7Yq…rN4mP2</div>
              <div className="term-badge">LIVE</div>
            </div>
            <div className="term-body">
              {visible.map((item, i) => {
                const { line, full } = item;
                if (line.t === 'spacer') return <div key={i} style={{height: 6}} />;
                if (line.t === 'box-bad') {
                  return (
                    <div className="term-box" key={i}>
                      {line.lines.map((l, j) => (
                        <div key={j} className={`term-line term-row-${l.t}`}>
                          <span>{l.v}</span>
                        </div>
                      ))}
                    </div>
                  );
                }
                if (line.t === 'prompt') {
                  const shown = full ? line.v : line.v.slice(0, charIdx);
                  return (
                    <div className="term-line" key={i}>
                      <span className="prompt">›</span>
                      <span>{shown.replace(/^\$ /, '')}{!full && <span className="caret" />}</span>
                    </div>
                  );
                }
                if (line.t === 'kv') {
                  const total = line.k + line.v;
                  const shown = full ? total : total.slice(0, charIdx);
                  const kLen = line.k.length;
                  return (
                    <div className="term-line term-kv" key={i}>
                      <span>{shown.slice(0, kLen)}</span>
                      <b>{shown.slice(kLen)}</b>{!full && <span className="caret" />}
                    </div>
                  );
                }
                // out
                const shown = full ? line.v : line.v.slice(0, charIdx);
                return (
                  <div className="term-line" key={i}>
                    <span className="out">{shown}</span>{!full && <span className="caret" />}
                  </div>
                );
              })}
              {done && (
                <button

const Install = () => {
  const [copied, setCopied] = React.useState(false);
  const [tab, setTab] = React.useState('chrome');

  const snippets = {
    chrome: `# chromium-based (chrome, brave, arc, edge)
git clone https://github.com/0xnullpavel/solshield
cd solshield && pnpm install
pnpm -F @solshield/extension build
# chrome > chrome://extensions > developer mode ON
# > load unpacked > apps/extension/build/chrome-mv3-prod`,
    api: `# call the SolShield API directly (POST)
curl -X POST https://solshield.dev/api/inspect-message \\
  -H 'content-type: application/json' \\
  -d '{"message":"phishing.com wants you to sign in...","origin":"https://magiceden.io"}'
# returns { verdict, score, findings[], summary }`,
    selfhost: `# fully self-host the API + dashboard
git clone https://github.com/0xnullpavel/solshield
cd solshield && cp .env.example .env
# add your ANTHROPIC_API_KEY + SOLANA_RPC_URL
docker compose up -d
# now point the extension at http://localhost:3000`,
  };

  const copy = () => {
    navigator.clipboard.writeText(snippets[tab]).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    });
  };

  // Build React children directly; no string-tag intermediate.
  const tokenize = (s) => {
    const keywords = /\b(git clone|cd|pnpm install|pnpm build|curl|visit|sh|solshield)\b/;
    const url = /(https?:\/\/\S+)/;
    const param = /(--\w+|<[a-zA-Z-]+>)/;
    const mk = (text, cls) => ({ text, cls });

    const splitBy = (chunks, re, cls) => {
      const out = [];
      for (const ch of chunks) {
        if (ch.cls) { out.push(ch); continue; }
        const parts = ch.text.split(re);
        parts.forEach((p, i) => {
          if (!p) return;
          // Odd indices are captured groups (the match)
          out.push(mk(p, i % 2 === 1 ? cls : null));
        });
      }
      return out;
    };

    return s.split('\n').map((line, i) => {
      if (line.startsWith('#')) {
        return <div key={i}><span className="tok-c">{line}</span></div>;
      }
      let chunks = [{ text: line, cls: null }];
      chunks = splitBy(chunks, keywords, 'tok-k');
      chunks = splitBy(chunks, url, 'tok-s');
      chunks = splitBy(chunks, param, 'tok-p');
      return (
        <div key={i}>
          {chunks.map((c, j) =>
            c.cls
              ? <span key={j} className={c.cls}>{c.text}</span>
              : <span key={j}>{c.text}</span>
          )}
        </div>
      );
    });
  };

  return (
    <section className="section" id="install">
      <div className="container">
        <div className="install">
          <div>
            <div className="kicker" style={{marginBottom: 14}}>get it</div>
            <h3 style={{marginBottom: 18, lineHeight: 1.25}}>Install in under 60 seconds. Uninstall if it fails you once.</h3>
            <p>
              Free forever. No sign-up. No cloud account. Your wallet keeps its privacy
              and you get a second brain that reads ASM for breakfast.
            </p>

            <div style={{display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 20}}>
              <a
                href="https://github.com/0xnullpavel/solshield#install"
                target="_blank"
                rel="noopener noreferrer"
                className="btn btn-primary"
              >▸ chrome (load unpacked)</a>
              <a
                href="https://github.com/0xnullpavel/solshield"
                target="_blank"
                rel="noopener noreferrer"
                className="btn btn-ghost"
              >github source</a>
            </div>

            <div style={{fontSize: 12, color: 'var(--fg-2)', lineHeight: 1.7}}>
              <div>v0.4.10 · public beta · MIT licensed</div>
              <div style={{color: 'var(--fg-1)'}}>
                Chrome Web Store listing pending · pnpm build + Load Unpacked works today.
              </div>
            </div>
          </div>

          <div>
            <div className="code-block">
              <div className="cb-head">
                <div style={{display: 'flex', gap: 4}}>
                  {['chrome', 'api', 'selfhost'].map(t => (
                    <button
                      key={t}
                      onClick={() => setTab(t)}
                      style={{
                        padding: '2px 8px',
                        background: tab === t ? 'var(--bg-2)' : 'transparent',
                        color: tab === t ? 'var(--ok)' : 'var(--fg-2)',
                        border: '1px solid',
                        borderColor: tab === t ? 'var(--br-2)' : 'transparent',
                        borderRadius: 3,
                        fontSize: 11,
                        letterSpacing: '0.04em',
                        cursor: 'pointer',
                      }}
                    >{t}</button>
                  ))}
                </div>
                <button className={`cb-copy ${copied ? 'copied' : ''}`} onClick={copy}>
                  {copied ? '✓ copied' : 'copy'}
                </button>
              </div>
              <pre>{tokenize(snippets[tab])}</pre>
            </div>

            <div style={{
              marginTop: 12, fontSize: 11, color: 'var(--fg-2)',
              display: 'flex', gap: 14, flexWrap: 'wrap'
            }}>
              <span>⎆ signed builds</span>
              <span>⎆ reproducible from source</span>
              <span>⎆ sha256 pinned</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};

/* ==== Tweaks.jsx ==== */
const Tweaks = ({ state, setState }) => {
  const [open, setOpen] = React.useState(false);

  // Listen for host toggle
  React.useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    // announce availability AFTER listener is wired
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const persist = (edits) => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  };

  const update = (k, v) => {
    setState(s => ({ ...s, [k]: v }));
    persist({ [k]: v });
  };

  if (!open) return null;

  return (
    <aside className="tweaks">
      <div className="tweaks-head">
        <span>tweaks · solshield</span>
        <span className="close" onClick={() => setOpen(false)}>×</span>
      </div>
      <div className="tweaks-body">
        <div className="tweak-row">
          <label>accent palette</label>
          <div className="tweak-opts">
            {[
              ['triad', 'triad'],
              ['duo', 'duo'],
              ['cyan', 'cyan'],
              ['amber', 'amber'],
            ].map(([k, label]) => (
              <button key={k} className={state.accent === k ? 'on' : ''} onClick={() => update('accent', k)}>{label}</button>
            ))}
          </div>
        </div>

        <div className="tweak-row">
          <label>hero style</label>
          <div className="tweak-opts">
            {[
              ['terminal', 'terminal'],
              ['minimal',  'minimal'],
              ['wide',     'wide copy'],
            ].map(([k, label]) => (
              <button key={k} className={state.heroStyle === k ? 'on' : ''} onClick={() => update('heroStyle', k)}>{label}</button>
            ))}
          </div>
        </div>

        <div className="tweak-row">
          <label>density</label>
          <div className="tweak-opts">
            {['airy', 'medium', 'dense'].map(k => (
              <button key={k} className={state.density === k ? 'on' : ''} onClick={() => update('density', k)}>{k}</button>
            ))}
          </div>
        </div>

        <div className="tweak-row tweak-toggle">
          <label style={{margin: 0}}>matrix background</label>
          <div className={`sw ${state.matrixBg ? 'on' : ''}`} onClick={() => update('matrixBg', !state.matrixBg)} />
        </div>

        <div className="tweak-row tweak-toggle">
          <label style={{margin: 0}}>live ticker</label>
          <div className={`sw ${state.liveTicker ? 'on' : ''}`} onClick={() => update('liveTicker', !state.liveTicker)} />
        </div>
      </div>
    </aside>
  );
};

window.Tweaks = Tweaks;
