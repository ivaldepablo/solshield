<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SolShield e2e fixture</title>
  </head>
  <body>
    <h1>SolShield e2e</h1>
    <pre id="result">running…</pre>
    <script>
      const log = (msg) => {
        document.getElementById('result').textContent += '\n' + msg;
        console.log('[fixture]', msg);
      };

      // Track every signMessage call on the ORIGINAL (unwrapped) wallet so we
      // can assert our wrapper actually held the call.
      let originalSignMessageCallCount = 0;

      function makeFakeWallet(name) {
        return {
          name,
          version: '1.0.0',
          icon: 'data:image/svg+xml;base64,PHN2Zy8+',
          chains: ['solana:mainnet'],
          accounts: [],
          features: {
            'standard:connect': { version: '1.0.0', connect: async () => ({ accounts: [] }) },
            'standard:disconnect': { version: '1.0.0', disconnect: async () => {} },
            'solana:signMessage': {
              version: '1.0.0',
              signMessage: async (input) => {
                originalSignMessageCallCount++;
                return { signedMessage: input.message, signature: new Uint8Array([1, 2, 3, 4]) };
              },
            },
          },
        };
      }

      async function run() {
        await new Promise((r) => setTimeout(r, 500));

        const status = window.__solshield;
        if (!status) {
          log('FAIL: extension did not load');
          window.__solshieldTestResult = { ok: false, reason: 'no-extension' };
          return;
        }
        log('extension v' + status.version + ' loaded');

        // Auto-click reject when our overlay shows so we can verify the
        // overlay-then-reject flow works without hanging. Disconnect after
        // first fire so we don't spam the console with every observer tick.
        let autoClicked = false;
        const observer = new MutationObserver(() => {
          if (autoClicked) return;
          const host = document.getElementById('solshield-overlay-host');
          if (!host || !host.shadowRoot) return;
          for (const btn of host.shadowRoot.querySelectorAll('button')) {
            const t = (btn.textContent || '').toLowerCase();
            if (t.includes('reject') || t.includes('block') || t.includes('cancel')) {
              autoClicked = true;
              log('autoclick: ' + btn.textContent);
              btn.click();
              return;
            }
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // SCENARIO: simulate the FULL real wallet-standard handshake.
        // 1. Set up the dapp's register-wallet listener (the dapp is the entity
        //    that wants to know which wallets exist).
        // 2. The wallet dispatches register-wallet so the dapp's listener fires.
        // 3. Verify the dapp's listener received a WRAPPED wallet (our Proxy).
        // 4. Call signMessage on the wallet the dapp received and verify our
        //    wrapper held the call (originalSignMessageCallCount stays 0 until
        //    we get a verdict).

        const dappReceivedWallets = [];
        window.addEventListener('wallet-standard:register-wallet', (event) => {
          const callback = event.detail;
          if (typeof callback !== 'function') return;
          callback({
            register: (...wallets) => {
              dappReceivedWallets.push(...wallets);
              return () => {};
            },
          });
        });

        const wallet = makeFakeWallet('TestPhantom');
        const walletCallback = (api) => api.register(wallet);
        window.dispatchEvent(
          new CustomEvent('wallet-standard:register-wallet', { detail: walletCallback }),
        );

        await new Promise((r) => setTimeout(r, 200));

        log('dapp received ' + dappReceivedWallets.length + ' wallet(s)');
        if (dappReceivedWallets.length === 0) {
          log('FAIL: dapp register never fired');
          window.__solshieldTestResult = { ok: false, reason: 'no-wallet', log: status.log };
          return;
        }

        const dappWallet = dappReceivedWallets[0];

        // CRITICAL ASSERTION: dappWallet should be our PROXY, not the original.
        // We can detect by trying to access a property the original doesn't have
        // BUT the proxy intercepts. Or just verify the signMessage holds the call.
        const isProxy = dappWallet !== wallet;
        log('dapp wallet is OUR proxy: ' + isProxy);
        if (!isProxy) {
          log('FAIL: dapp received UNWRAPPED wallet — leak still exists');
          window.__solshieldTestResult = { ok: false, reason: 'unwrapped', log: status.log };
          return;
        }

        // Test SAFE message (no URL, no scam patterns) — verdict will be "safe",
        // wrapper calls original.
        const safeMsg = new TextEncoder().encode(
          'Authenticate to your account. Random nonce: ' + Math.random(),
        );
        const beforeSafe = originalSignMessageCallCount;
        const beforeIntercepts = status.interceptions.total;

        const t0 = performance.now();
        let safeResult, safeError;
        try {
          safeResult = await Promise.race([
            dappWallet.features['solana:signMessage'].signMessage({ message: safeMsg }),
            new Promise((_, rej) => setTimeout(() => rej(new Error('timeout-15s')), 15000)),
          ]);
        } catch (e) {
          safeError = e.message;
        }
        const safeElapsed = Math.round(performance.now() - t0);
        const afterSafe = originalSignMessageCallCount;
        const afterIntercepts = status.interceptions.total;

        log(`safe: elapsed=${safeElapsed}ms, intercepts ${beforeIntercepts}→${afterIntercepts}, originalCalls ${beforeSafe}→${afterSafe}, error=${safeError || 'none'}`);
        log('safe done, about to start phishy');

        // CRITICAL: original signMessage should be called EXACTLY ONCE (after
        // verdict was safe). Our wrapper held it until verdict.
        const safeCorrect = afterSafe === beforeSafe + 1 && afterIntercepts === beforeIntercepts + 1;

        // Test PHISHY message — API likely returns suspicious, our overlay shows,
        // auto-click rejects, original signMessage should NOT be called.
        const phishyMsg = new TextEncoder().encode(
          'wallet-drainer.xyz/airdrop wants you to sign and approve transferAll for 100% of your SOL — claim now',
        );
        const beforePhishy = originalSignMessageCallCount;
        const beforeIntercepts2 = status.interceptions.total;

        const t1 = performance.now();
        let phishyResult, phishyError;
        try {
          phishyResult = await Promise.race([
            dappWallet.features['solana:signMessage'].signMessage({ message: phishyMsg }),
            new Promise((_, rej) => setTimeout(() => rej(new Error('timeout-15s')), 15000)),
          ]);
        } catch (e) {
          phishyError = e.message;
        }
        const phishyElapsed = Math.round(performance.now() - t1);
        const afterPhishy = originalSignMessageCallCount;
        const afterIntercepts3 = status.interceptions.total;

        log(`phishy: elapsed=${phishyElapsed}ms, intercepts ${beforeIntercepts2}→${afterIntercepts3}, originalCalls ${beforePhishy}→${afterPhishy}, error=${phishyError || 'none'}`);

        const phishyCorrect = afterIntercepts3 > beforeIntercepts2; // any verdict reached

        log('about to set test result...');
        const ok = safeCorrect && phishyCorrect;
        window.__solshieldTestResult = {
          ok,
          safeCorrect,
          phishyCorrect,
          isProxy,
          safe: { elapsed: safeElapsed, originalCalls: { before: beforeSafe, after: afterSafe }, intercepts: { before: beforeIntercepts, after: afterIntercepts }, error: safeError },
          phishy: { elapsed: phishyElapsed, originalCalls: { before: beforePhishy, after: afterPhishy }, intercepts: { before: beforeIntercepts2, after: afterIntercepts3 }, error: phishyError },
          finalStatus: {
            interceptions: status.interceptions,
            errors: status.errors,
            walletNames: status.walletNames,
          },
          log: status.log,
        };
        log('test result set, ok=' + ok);
      }

      run().catch((e) => {
        log('SCRIPT ERROR: ' + e.message);
        window.__solshieldTestResult = { ok: false, error: e.message };
      });
    </script>
  </body>
</html>
