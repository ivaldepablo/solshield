<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SolShield e2e fixture</title>
  </head>
  <body>
    <h1>SolShield e2e test fixture</h1>
    <pre id="result">running…</pre>
    <script>
      const log = (msg) => {
        document.getElementById('result').textContent += '\n' + msg;
      };

      function makeFakeWallet(name) {
        return {
          name,
          version: '1.0.0',
          icon: 'data:image/svg+xml;base64,PHN2Zy8+',
          chains: ['solana:mainnet'],
          accounts: [],
          features: {
            'standard:connect': { version: '1.0.0', connect: async () => ({ accounts: [] }) },
            'standard:disconnect': { version: '1.0.0', disconnect: async () => {} },
            'solana:signMessage': {
              version: '1.0.0',
              signMessage: async (input) => ({
                signedMessage: input.message,
                signature: new Uint8Array([1, 2, 3, 4]),
              }),
            },
          },
        };
      }

      function installLegacyWindowSolana() {
        // Simulate Phantom-style window.solana (it's defined as an object
        // with signTransaction / signAllTransactions / signMessage).
        Object.defineProperty(window, 'solana', {
          configurable: true,
          enumerable: true,
          value: {
            isPhantom: true,
            isConnected: true,
            publicKey: { toBase58: () => 'TEST_PUBLIC_KEY' },
            signMessage: async (bytes) => ({
              signature: new Uint8Array([5, 6, 7, 8]),
              publicKey: 'TEST_PUBLIC_KEY',
            }),
            signTransaction: async (tx) => tx,
            signAllTransactions: async (txs) => txs,
          },
        });
      }

      async function runScenarioWalletStandard(name, payload) {
        log(`\n--- scenario [${name}] ---`);
        const wallet = makeFakeWallet('TestPhantom_' + name);
        const walletCallback = (api) => api.register(wallet);

        window.__appReceivedWallets = window.__appReceivedWallets || [];
        const dappRegistry = {
          register: (...wallets) => {
            window.__appReceivedWallets.push(...wallets);
            return () => {};
          },
        };

        // Listen for register-wallet so the dapp can also see the wallet
        const listener = (event) => {
          if (typeof event.detail === 'function') event.detail(dappRegistry);
        };
        window.addEventListener('wallet-standard:register-wallet', listener);

        window.dispatchEvent(
          new CustomEvent('wallet-standard:app-ready', { detail: dappRegistry }),
        );
        window.dispatchEvent(
          new CustomEvent('wallet-standard:register-wallet', { detail: walletCallback }),
        );

        await new Promise((r) => setTimeout(r, 200));

        const dappWallet = window.__appReceivedWallets[window.__appReceivedWallets.length - 1];
        if (!dappWallet) {
          log(`FAIL: dapp didn't receive wallet`);
          return { ok: false };
        }

        const status = window.__solshield;
        const before = status.interceptions.total;
        const t0 = performance.now();

        const signFn = dappWallet.features['solana:signMessage'].signMessage;
        let result, error;
        try {
          result = await Promise.race([
            signFn({ message: payload }),
            new Promise((_, rej) => setTimeout(() => rej(new Error('hard-timeout-15s')), 15000)),
          ]);
        } catch (e) {
          error = e.message;
        }

        const elapsed = Math.round(performance.now() - t0);
        const status2 = window.__solshield;
        const after = status2.interceptions.total;
        log(`elapsed: ${elapsed}ms, intercepts ${before}→${after}, error=${error || 'none'}`);

        window.removeEventListener('wallet-standard:register-wallet', listener);
        return {
          ok: after > before,
          elapsed,
          before,
          after,
          error,
          gotResult: result !== undefined,
        };
      }

      async function runScenarioLegacy(name, payload) {
        log(`\n--- scenario [${name}] ---`);
        // Wait for hooks to be installed (initProviderPatching polls every 100ms)
        await new Promise((r) => setTimeout(r, 600));

        const status = window.__solshield;
        if (!status.hooks.legacyWindowSolana) {
          log(`FAIL: window.solana hook not installed (was: ${status.hooks.legacyWindowSolana})`);
          return { ok: false };
        }

        const before = status.interceptions.total;
        const t0 = performance.now();

        let result, error;
        try {
          result = await Promise.race([
            window.solana.signMessage(payload),
            new Promise((_, rej) => setTimeout(() => rej(new Error('hard-timeout-15s')), 15000)),
          ]);
        } catch (e) {
          error = e.message;
        }

        const elapsed = Math.round(performance.now() - t0);
        const status2 = window.__solshield;
        const after = status2.interceptions.total;
        log(`elapsed: ${elapsed}ms, intercepts ${before}→${after}, error=${error || 'none'}`);

        return {
          ok: after > before,
          elapsed,
          before,
          after,
          error,
          gotResult: result !== undefined,
        };
      }

      async function run() {
        await new Promise((r) => setTimeout(r, 500));

        const status = window.__solshield;
        if (!status) {
          log('FAIL: extension did not load');
          window.__solshieldTestResult = { ok: false, reason: 'no-extension' };
          return;
        }
        log('extension v' + status.version + ' loaded');

        installLegacyWindowSolana();
        log('installed fake window.solana');

        // Truly safe — no URLs, no suspicious patterns. API should return safe.
        const safeMsg = new TextEncoder().encode(
          'Sign this message to authenticate your account. Nonce: ' + Math.random(),
        );
        // Has phishing patterns (suspicious URL, drainer language). API should flag this.
        // For the test, after our overlay is shown we'll auto-click it via the autoclick code below.
        const phishyMsg = new TextEncoder().encode(
          'wallet-drainer.xyz/airdrop wants you to approve signTransaction transferring all your SOL — claim now!',
        );

        // Auto-click the overlay's REJECT button when it appears, so the test
        // doesn't hang on user input. This proves the overlay was rendered AND
        // that our wrapper handles user-rejection correctly.
        const observer = new MutationObserver(() => {
          const host = document.getElementById('solshield-overlay-host');
          if (!host) return;
          const root = host.shadowRoot;
          if (!root) return;
          // Find any button labelled like "reject" / "block" / "cancel".
          const buttons = root.querySelectorAll('button');
          for (const btn of buttons) {
            const txt = (btn.textContent || '').toLowerCase();
            if (txt.includes('reject') || txt.includes('block') || txt.includes('cancel')) {
              log('autoclick: clicking overlay button "' + btn.textContent + '"');
              btn.click();
              return;
            }
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        const results = {};
        results.walletStandardSafe = await runScenarioWalletStandard('ws-safe', safeMsg);
        results.walletStandardPhishy = await runScenarioWalletStandard('ws-phishy', phishyMsg);
        results.legacySafe = await runScenarioLegacy('legacy-safe', safeMsg);
        results.legacyPhishy = await runScenarioLegacy('legacy-phishy', phishyMsg);

        const finalStatus = window.__solshield;
        log('\n--- final status ---');
        log('total intercepts: ' + finalStatus.interceptions.total);
        log('flagged: ' + finalStatus.interceptions.flagged);
        log('safe: ' + finalStatus.interceptions.safe);
        log('failed-open: ' + finalStatus.interceptions.failedOpen);
        log('errors: ' + finalStatus.errors.length);

        const allOk = Object.values(results).every((r) => r.ok);

        window.__solshieldTestResult = {
          ok: allOk,
          scenarios: results,
          finalStatus: {
            interceptions: finalStatus.interceptions,
            errors: finalStatus.errors,
            walletNames: finalStatus.walletNames,
          },
          log: finalStatus.log,
        };
      }

      run().catch((e) => {
        log('SCRIPT ERROR: ' + e.message);
        window.__solshieldTestResult = { ok: false, error: e.message };
      });
    </script>
  </body>
</html>
