<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SolShield e2e fixture</title>
  </head>
  <body>
    <h1>SolShield e2e test fixture</h1>
    <p>This page simulates a Phantom-like wallet via Wallet Standard so we can
       run the extension end-to-end without a real wallet.</p>
    <pre id="result">running…</pre>
    <script>
      // Wait for the extension to inject its hooks (run_at: document_start
      // means the hook should be ready by the time DOMContentLoaded fires,
      // but the scripting.registerContentScripts path may take an extra tick).
      const log = (msg) => {
        document.getElementById('result').textContent += '\n' + msg;
      };

      function makeFakeWallet() {
        const realSignMessage = async (input) => ({
          signedMessage: input.message,
          signature: new Uint8Array([1, 2, 3, 4]),
        });
        return {
          name: 'TestPhantom',
          version: '1.0.0',
          icon: 'data:image/svg+xml;base64,PHN2Zy8+',
          chains: ['solana:mainnet'],
          accounts: [],
          features: {
            'standard:connect': { version: '1.0.0', connect: async () => ({ accounts: [] }) },
            'standard:disconnect': { version: '1.0.0', disconnect: async () => {} },
            'solana:signMessage': {
              version: '1.0.0',
              signMessage: realSignMessage,
            },
          },
        };
      }

      async function run() {
        // Give extension time to install hooks
        await new Promise((r) => setTimeout(r, 500));

        const status = (window).__solshield;
        if (!status) {
          log('FAIL: extension did not load (window.__solshield missing)');
          window.__solshieldTestResult = { ok: false, reason: 'no-extension' };
          return;
        }
        log('extension v' + status.version + ' loaded');
        log('safeMode: ' + status.safeMode);

        // SCENARIO: simulate a real wallet-standard handshake.
        // 1. The "wallet" is loaded first and registers itself via the
        //    `wallet-standard:register-wallet` event whose callback is a fn
        //    that receives a registry api, on which it calls register(wallet).
        // 2. The dApp comes later and dispatches `wallet-standard:app-ready`,
        //    listening for register-wallet via its OWN handler too.
        const wallet = makeFakeWallet();

        // The wallet's "callback" — receives an api, calls api.register(wallet)
        const walletCallback = (api) => {
          api.register(wallet);
        };

        // The wallet "fires" register-wallet so any listener (us OR the dapp)
        // can connect to it.
        window.dispatchEvent(
          new CustomEvent('wallet-standard:register-wallet', { detail: walletCallback }),
        );

        // Now the dapp comes online. It dispatches app-ready to discover any
        // wallet that loaded after the dapp script ran. AND it sets up its
        // own listener for register-wallet so it catches wallets that loaded
        // before the dapp (which is what most real dapps do via @wallet-standard/app).
        window.__appReceivedWallets = [];
        const dappRegistry = {
          register: (...wallets) => {
            window.__appReceivedWallets.push(...wallets);
            return () => {};
          },
        };

        // Listen for register-wallet (catches future wallets) — and re-fire
        // the SAME wallet so the dapp also picks it up.
        window.addEventListener('wallet-standard:register-wallet', (event) => {
          const cb = event.detail;
          if (typeof cb === 'function') cb(dappRegistry);
        });

        window.dispatchEvent(
          new CustomEvent('wallet-standard:app-ready', { detail: dappRegistry }),
        );

        // Re-fire register-wallet now that the dapp's listener is set up
        // (the wallet was registered before the listener existed).
        window.dispatchEvent(
          new CustomEvent('wallet-standard:register-wallet', { detail: walletCallback }),
        );

        // Give wraps time to register
        await new Promise((r) => setTimeout(r, 200));

        const status2 = (window).__solshield;
        log('wallets wrapped: ' + status2.hooks.walletStandardWallets);
        log('wallet names: ' + JSON.stringify(status2.walletNames));
        log('events in log: ' + status2.log.length);

        const dappWallets = window.__appReceivedWallets || [];
        if (dappWallets.length === 0) {
          log('FAIL: no wallets reached the dapp register');
          window.__solshieldTestResult = { ok: false, reason: 'no-dapp-wallets', log: status2.log };
          return;
        }

        const w = dappWallets[0];
        log('dapp received wallet: ' + w.name);

        const signFn = w.features['solana:signMessage'].signMessage;
        log('signFn type: ' + typeof signFn);

        const beforeIntercepts = status2.interceptions.total;
        log('intercepts before: ' + beforeIntercepts);

        const message = new TextEncoder().encode('phishy.xyz wants you to sign in...');

        // Race signFn against a hard timeout so we don't hang forever — and
        // periodically log the extension's view of what's happening.
        const monitor = setInterval(() => {
          const cur = (window).__solshield;
          log(`[monitor t+${Math.round(performance.now())}ms] events=${cur.log.length} intercepts=${cur.interceptions.total}`);
        }, 1500);

        const hardTimeout = new Promise((_, rej) =>
          setTimeout(() => rej(new Error('hard timeout 12s')), 12000),
        );

        try {
          const result = await Promise.race([signFn({ message }), hardTimeout]);
          log('signFn returned: ' + JSON.stringify(result));
        } catch (e) {
          log('signFn threw: ' + e.message);
        } finally {
          clearInterval(monitor);
        }

        const status3 = (window).__solshield;
        const afterIntercepts = status3.interceptions.total;
        log('intercepts after: ' + afterIntercepts);
        log('events in log after: ' + status3.log.length);

        // Print last 5 events
        log('\n--- last 5 log events ---');
        status3.log.slice(-5).forEach((e) => {
          log(`[${e.level}] ${e.tag}: ${e.msg}`);
        });

        const wasIntercepted = afterIntercepts > beforeIntercepts;
        window.__solshieldTestResult = {
          ok: wasIntercepted,
          beforeIntercepts,
          afterIntercepts,
          log: status3.log,
          walletNames: status3.walletNames,
          walletsWrapped: status3.hooks.walletStandardWallets,
          errors: status3.errors,
        };
      }

      run().catch((e) => {
        log('SCRIPT ERROR: ' + e.message);
        window.__solshieldTestResult = { ok: false, reason: 'script-error', error: e.message };
      });
    </script>
  </body>
</html>
