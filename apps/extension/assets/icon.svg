<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded-square background -->
  <rect width="128" height="128" rx="22" fill="#0a0a0f"/>

  <!-- Subtle inner border for that bezel feel -->
  <rect x="3" y="3" width="122" height="122" rx="20"
        fill="none" stroke="#00ff41" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Shield silhouette: classic heater shape, bold enough to read at 16x16 -->
  <path d="M 64 16
           L 106 28
           L 106 60
           Q 106 92 64 114
           Q 22 92 22 60
           L 22 28 Z"
        fill="url(#shieldFill)"
        stroke="#00ff41"
        stroke-width="5.5"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Triangle (delta) mark inside the shield -->
  <path d="M 64 44
           L 88 86
           L 40 86 Z"
        fill="#00ff41"
        fill-opacity="0.22"
        stroke="#00ff41"
        stroke-width="4.5"
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
