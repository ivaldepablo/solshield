<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="128" height="128" fill="#0a0a0f"/>

  <!-- Shield shape with neon green stroke -->
  <g filter="url(#neonGlow)">
    <!-- Shield: heater/kite shield silhouette -->
    <path d="M 32 20 L 96 20 L 96 60 C 96 90 64 108 64 108 C 64 108 32 90 32 60 Z"
          fill="none"
          stroke="#00ff41"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round"/>
  </g>

  <!-- Triangle mark (∆) inside shield -->
  <g filter="url(#neonGlow)">
    <path d="M 64 40 L 52 70 L 76 70 Z"
          fill="none"
          stroke="#00ff41"
          stroke-width="2"
          stroke-linejoin="round"
          stroke-linecap="round"/>
  </g>

  <!-- Subtle cyan accent line at bottom of shield -->
  <g filter="url(#neonGlow)" opacity="0.6">
    <line x1="45" y1="85" x2="83" y2="85"
          stroke="#00e5ff"
          stroke-width="1.5"
          stroke-linecap="round"/>
  </g>
</svg>
